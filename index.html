function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function fmt(v){v=Math.max(0,v||0);return String(Math.floor(v/60)).padStart(2,"0")+":"+String(Math.floor(v%60)).padStart(2,"0")}

function snapState(){return JSON.stringify({ratio:S.ratio,bg:S.bg,adj:S.adj,filter:S.filter,texts:S.texts,captions:S.captions,beats:S.beats,scenes:S.scenes,clips:S.clips.map(c=>({id:c.id,name:c.name,kind:c.kind,start:c.start||0,end:c.end??null,timelineStart:c.timelineStart||0,speed:c.speed||1,volume:c.volume??1,transition:c.transition||"None",transform:c.transform||null,keyframes:c.keyframes||[]}))})}

function undo(){if(!S.history.length)return;S.future.push(snapState());restoreState(S.history.pop())}

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains("projects"))db.createObjectStore("projects",{keyPath:"id"});if(!db.objectStoreNames.contains("media"))db.createObjectStore("media",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function saveProject(){try{await dbPut("projects",{id:"current",state:snapState(),savedAt:Date.now()});for(const c of S.clips){if(c.file)await dbPut("media",{id:c.id,name:c.name,type:c.file.type,blob:c.file})}S.dbReady=true;$("#status").textContent="Project + source media saved locally.";localStorage.setItem("sshk-project-version","3")}catch(e){$("#status").textContent="Save failed: "+e.message}}
async function loadProject(){try{let ps=await dbAll("projects"),p=ps.find(x=>x.id==="current");if(!p)return;let media=await dbAll("media");let q=JSON.parse(p.state);S.ratio=q.ratio||S.ratio;S.bg=q.bg||S.bg;S.adj=q.adj||S.adj;S.filter=q.filter||"none";S.texts=q.texts||[];S.captions=q.captions||[];S.beats=q.beats||[];S.scenes=q.scenes||[];S.clips=[];for(const m of media){let f=m.blob,u=URL.createObjectURL(f);if(m.type.startsWith("image/")){let im=new Image();im.src=u;await im.decode();S.clips.push({id:m.id,name:m.name,kind:"image",el:im,file:f})}else if(m.type.startsWith("video/")){let v=document.createElement("video");v.src=u;v.muted=true;v.playsInline=true;await new Promise(r=>v.onloadedmetadata=r);S.clips.push({id:m.id,name:m.name,kind:"video",el:v,file:f})}else{let a=new Audio(u);await new Promise(r=>a.onloadedmetadata=r);S.clips.push({id:m.id,name:m.name,kind:"audio",el:a,file:f})}}for(const z of q.clips||[]){let c=S.clips.find(x=>x.id===z.id);if(c)Object.assign(c,z)}S.selected=S.clips.find(c=>c.kind==="video")?.id||S.clips[0]?.id||null;$("#status").textContent="Restored saved project with source media.";render()}catch(e){console.warn(e)}}
function filterCSS(){let f="brightness("+S.adj.brightness+"%) contrast("+S.adj.contrast+"%) saturate("+S.adj.saturation+"%) blur("+S.adj.blur+"px)";if(S.filter==="mono")f+=" grayscale(1)";if(S.filter==="warm")f+=" sepia(.25) saturate(1.15)";if(S.filter==="cool")f+=" hue-rotate(12deg) saturate(.9)";if(S.filter==="vintage")f+=" sepia(.35) contrast(1.08)";return f}
function keyframeAt(c,time){let base={x:0,y:0,scale:1,rotation:0,opacity:100};let k=(c.keyframes||[]).slice().sort((a,b)=>a.time-b.time);if(!k.length)return {...base,...(c.transform||{})};if(time<=k[0].time)return {...base,...k[0]};if(time>=k.at(-1).time)return {...base,...k.at(-1)};let i=1;while(i<k.length&&k[i].time<time)i++;let a=k[i-1],b=k[i],p=clamp((time-a.time)/(b.time-a.time),0,1);let ease=b.ease||"linear";if(ease==="easeIn")p=p*p;if(ease==="easeOut")p=1-(1-p)*(1-p);if(ease==="easeInOut")p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;return{x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p,scale:a.scale+(b.scale-a.scale)*p,rotation:a.rotation+(b.rotation-a.rotation)*p,opacity:a.opacity+(b.opacity-a.opacity)*p}}
function drawMedia(c,time,alpha=1,extraScale=1){const[w,h]=dims();if(!c)return;let tr=keyframeAt(c,time);ctx.save();ctx.globalAlpha=clamp(S.adj.opacity/100,0,1)*clamp((tr.opacity??100)/100,0,1)*alpha;ctx.filter=filterCSS();ctx.translate(w/2+(tr.x||0),h/2+(tr.y||0));ctx.rotate((tr.rotation||0)*Math.PI/180);ctx.scale((tr.scale||1)*extraScale,(tr.scale||1)*extraScale);if(c.kind==="image"){let z=Math.max(w/c.el.naturalWidth,h/c.el.naturalHeight),dw=c.el.naturalWidth*z,dh=c.el.naturalHeight*z;ctx.drawImage(c.el,-dw/2,-dh/2,dw,dh)}else if(c.kind==="video"){let z=Math.max(w/c.el.videoWidth,h/c.el.videoHeight),dw=c.el.videoWidth*z,dh=c.el.videoHeight*z;ctx.drawImage(c.el,-dw/2,-dh/2,dw,dh)}ctx.restore()}
function draw(){let[w,h]=dims();cv.width=w;cv.height=h;ctx.fillStyle=S.bg;ctx.fillRect(0,0,w,h);let list=videoTimeline(),g=S.timelineTime||0,item=list.find(x=>g>=x.start&&g<x.end)||list.at(-1),c=item?.c||selected();if(!c){$("#empty").style.display="grid";$("#clock").textContent="00:00 / 00:00";return}$("#empty").style.display="none";if(c.kind==="video"){let local=(g-(item?.start||0))+(c.start||0);local=clamp(local,c.start||0,c.end==null?c.el.duration:c.end);c.el.currentTime=local;let trans=Math.min(.7,Math.max(.2,duration(c)*.12)),next=list.find(x=>x.start===item.end);if(next&&g>item.end-trans&&c.transition&&c.transition!=="None"){let p=clamp((g-(item.end-trans))/trans,0,1);drawMedia(c,local,1-p);let nc=next.c,nlocal=(nc.start||0)+p*Math.min(trans,duration(nc));nc.el.currentTime=nlocal;if(c.transition==="Slide"){ctx.save();ctx.translate((1-p)*w,0);drawMedia(nc,nlocal,p);ctx.restore()}else if(c.transition==="Wipe"){ctx.save();ctx.beginPath();ctx.rect(0,0,w*p,h);ctx.clip();drawMedia(nc,nlocal,1);ctx.restore()}else if(c.transition==="Zoom")drawMedia(nc,nlocal,p,1+.08*(1-p));else drawMedia(nc,nlocal,p)}else drawMedia(c,local)}else if(c.kind==="image")drawMedia(c,0);else{ctx.fillStyle="#202734";ctx.fillRect(0,0,w,h)}let current=c.kind==="video"?clamp((g-(item?.start||0))+(c.start||0),0,c.el.duration||999):0;(S.captions||[]).forEach(t=>{if(current>=t.start&&current<=t.end){ctx.save();ctx.font="800 "+(t.size||42)+"px system-ui";ctx.textAlign="center";ctx.lineWidth=6;ctx.strokeStyle="#000";ctx.strokeText(t.text,w/2,h-130);ctx.fillStyle=t.color||"#fff";ctx.fillText(t.text,w/2,h-130);ctx.restore()}});S.texts.forEach(t=>{ctx.save();ctx.globalAlpha=(t.opacity??100)/100;ctx.font=(t.weight||700)+" "+(t.size||72)+"px "+(t.font||"system-ui");ctx.textAlign=t.align||"center";ctx.fillStyle=t.color||"#fff";ctx.fillText(t.value,w/2+(t.x||0),h/2+(t.y||0));ctx.restore()});let total=totalTimeline();$("#clock").textContent=fmt(g)+" / "+fmt(total);$("#timelineTime").textContent=fmt(g);let pw function renderTracks(){["videoScroll","textScroll","capScroll","audioScroll"].forEach(id=>$("#"+id).innerHTML="");let scale=45;const add=(parent,c,cls)=>{let d=document.createElement("div");d.className="clip "+cls+(c.id===S.selected?" sel":"");d.style.width=Math.max(90,duration(c)*scale)+"px";d.innerHTML=(c.kind==="video"?"🎬 ":c.kind==="audio"?"🎵 ":"🖼️ ")+esc(c.name)+"<small>"+fmt(duration(c))+"</small>";d.onclick=()=>{S.selected=c.id;render()};d.draggable=true;d.ondragstart=e=>e.dataTransfer.setData("text/plain",c.id);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{let id=e.dataTransfer.getData("text/plain"),a=S.clips.findIndex(x=>x.id===id),b=S.clips.findIndex(x=>x.id===c.id);if(a>=0&&b>=0&&a!==b){history();let[z]=S.clips.splice(a,1);S.clips.splice(b,0,z);render()}};parent.appendChild(d)};S.clips.filter(c=>c.kind==="video").forEach(c=>add($("#videoScroll"),c,""));S.clips.filter(c=>c.kind==="audio").forEach(c=>add($("#audioScroll"),c,"audio-clip"));S.texts.forEach((t,i)=>{let d=document.createElement("div");d.className="clip text-clip"+(t.selected?" sel":"");d.style.width=Math.max(90,(t.end||5-(t.start||0))*scale)+"px";d.textContent="T "+(t.value||"Text");d.onclick=()=>{S.texts.forEach(x=>x.selected=false);t.selected=true;render()};$("#textScroll").appendChild(d)});(S.captions||[]).forEach((t,i)=>{let d=document.createElement("div");d.className="clip cap-clip"+(i===S.captionSelected?" sel":"");d.style.width=Math.max(90,((t.end||3)-(t.start||0))*scale)+"px";d.textContent="CC "+t.text;d.onclick=()=>{S.captionSelected=i;render()};$("#capScroll").appendChild(d)});let markers=document.createElement("div");markers.className="markers";S.beats.forEach(t=>{let m=document.createElement("span");m.className="snapline";m.style.left=(t*scale)+"px";markers.appendChild(m)});$("#videoScroll").appendChild(markers)}

}

  }catch(e){console.warn("Audio graph unavailable",e)}
  let vs=cv.captureStream(30),stream=new MediaStream([...vs.getVideoTracks(),...(dest?dest.stream.getAudioTracks():[])]);
  let mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(MediaRecorder.isTypeSupported)||"video/webm";
  let r=new MediaRecorder(stream,{mimeType:mime}),chunks=[];
  r.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  let done=new Promise(ok=>r.onstop=ok); r.start(); S.timelineTime=0;
  let total=totalTimeline();
  while(S.timelineTime<total){
    S.clips.filter(c=>c.kind==="audio").forEach(a=>{let q=(S.timelineTime-(a.timelineStart||0))+(a.start||0);if(q>=a.start&&q<(a.end??a.el.duration)){a.el.currentTime=q;a.el.play().catch(()=>{})}else a.el.pause()});
    draw(); await new Promise(q=>setTimeout(q,33)); S.timelineTime+=1/30;
  }
  r.stop(); await done; S.clips.filter(c=>c.kind==="audio").forEach(a=>a.el.pause());
  let webm=new Blob(chunks,{type:mime});
  if(!window.sshkFfmpegExport){$("#status").textContent="FFmpeg MP4 engine unavailable."; throw Error("FFmpeg engine unavailable");}
  $("#status").textContent="Converting WebM → H.264/AAC MP4 with FFmpeg…";
  try{
    let mp4=await window.sshkFfmpegExport(webm,(p)=>{$("#status").textContent="FFmpeg MP4: "+Math.round(p*100)+"%"});
    let bytes=new Uint8Array(await mp4.arrayBuffer()),valid=bytes.length>1024&&String.fromCharCode(...bytes.slice(4,8))==="ftyp";
    if(!valid)throw Error("FFmpeg returned an invalid MP4 container");
    let a=document.createElement("a");a.href=URL.createObjectURL(mp4);a.download="design-by-sshk-export.mp4";a.click();
    $("#status").textContent="MP4 export validated: H.264/AAC container, "+Math.round(mp4.size/1024)+" KB.";
  }catch(e){$("#status").textContent="FFmpeg export failed: "+e.message;throw e}finally{try{await audioCtx?.close()}catch(e){}}
}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;if(e.key===" "){e.preventDefault();S.playing?stop():play()}if(e.key==="j"){S.timelineTime=Math.max(0,S.timelineTime-.5);draw()}if(e.key==="l"){S.timelineTime=Math.min(totalTimeline(),S.timelineTime+.5);draw()}if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key==="y"){e.preventDefault();redo()}});
function render(){panel();renderTracks();inspector();draw()}
window.addEventListener("beforeunload",()=>{try{localStorage.setItem("sshk-autobackup",snapState())}catch(e){}});(async()=>{panel();render();await loadProject();if(!S.clips.length){let old=localStorage.getItem("sshk-autobackup");if(old)$("#status").textContent="Auto-backup metadata found. Import source media or Save Project to persist files."}})();
</script>
<script type="module">
window.sshkFfmpegExport=async function(webm,onProgress){
 const {FFmpeg}=await import("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/+esm");
 const {fetchFile,toBlobURL}=await import("https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/+esm");
 if(!window.__sshkFFmpeg){
  const f=new FFmpeg();
  f.on("progress",({progress})=>onProgress?.(progress));
  const base="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";
  await f.load({coreURL:await toBlobURL(base+"/ffmpeg-core.js","text/javascript"),wasmURL:await toBlobURL(base+"/ffmpeg-core.wasm","application/wasm")});
  window.__sshkFFmpeg=f;
 }
 const f=window.__sshkFFmpeg;
 await f.writeFile("input.webm",await fetchFile(webm));
 await f.exec(["-i","input.webm","-c:v","libx264","-preset","veryfast","-pix_fmt","yuv420p","-c:a","aac","-b:a","128k","-movflags","+faststart","output.mp4"]);
 const data=await f.readFile("output.mp4");
 return new Blob([data],{type:"video/mp4"});
};
</script>
