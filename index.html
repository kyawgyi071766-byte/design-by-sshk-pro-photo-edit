</style></head><body>
<div class="app">
<header class="top"><div class="brand"><i>SSHK</i> Pro Photo Edit</div><div class="spacer"></div><button class="btn" id="new">New</button><button class="btn" id="save">Save</button><button class="btn primary" id="export">Export MP4</button></header>

<section class="panel left" id="left"></section>

<section class="panel right"><div class="group"><h3>Inspector</h3><div id="inspector">No clip selected.</div></div><div class="group"><h3>AI Job</h3><div class="status" id="status">Ready.</div></div></section>

</div><input id="files" class="hidden" type="file" accept="image/*,video/*,audio/*" multiple>
<script>
var $=function(s){return document.querySelector(s)}, all=function(s){return Array.from(document.querySelectorAll(s))};
var S={clips:[],texts:[],selected:null,tab:"media",ratio:"9:16",adj:{brightness:100,contrast:100,saturation:100}};

function tracks(){["video","text","audio"].forEach(function(id){var e=$("#"+id);e.innerHTML="<label>"+id.toUpperCase()+"</label>"});S.clips.forEach(function(c){var d=document.createElement("div");d.className="clip "+(c.id===S.selected?"sel":"");d.textContent=c.name;d.onclick=function(){S.selected=c.id;render()};$("#"+(c.kind==="audio"?"audio":"video")).appendChild(d)});S.texts.forEach(function(t){var d=document.createElement("div");d.className="clip";d.textContent=t.value;$("#text").appendChild(d)})}
function inspector(){var c=S.clips.find(function(q){return q.id===S.selected});$("#inspector").innerHTML=c?'<div class="field"><label>Name</label><input id="nm"></div><button class="btn" id="del">Delete</button>':"No clip selected.";if(c){$("#nm").value=c.name;$("#nm").onchange=function(e){c.name=e.target.value;tracks()};$("#del").onclick=function(){S.clips=S.clips.filter(function(q){return q.id!==c.id});S.selected=S.clips[0]?S.clips[0].id:null;render()}}}
function render(){tracks();inspector();draw()}
function panel(){var p=$("#left");if(S.tab==="media")p.innerHTML='<div class="group"><h3>Import</h3><div class="drop">Photo, video or audio<br><button class="btn primary" id="pick">Choose files</button></div></div><button class="btn" id="clear">Clear timeline</button>';if(S.tab==="ai")p.innerHTML='<div class="group"><h3>AI Lab</h3><div class="field"><label>Instruction</label><textarea id="prompt" rows="4" placeholder="Make this a natural professional photo..."></textarea></div><div class="grid"><button class="btn primary ai" data-op="edit">AI Edit</button><button class="btn ai" data-op="enhance">Enhance</button><button class="btn ai" data-op="remove">Remove BG</button><button class="btn ai" data-op="expand">Expand</button><button class="btn ai" data-op="restore">Face Restore</button><button class="btn ai" data-op="generate">Text → Image</button></div></div>';if(S.tab==="text")p.innerHTML='<div class="group"><h3>Text</h3><div class="field"><label>Text</label><input id="tv" value="Design By SSHK"></div><div class="field"><label>Size</label><input id="ts" type="number" value="72"></div><button class="btn primary" id="add">Add text layer</button></div>';if(S.tab==="adjust")p.innerHTML='<div class="group"><h3>Adjustments</h3><div class="field"><label>Brightness</label><input id="br" type="range" min="0" max="200" value="'+S.adj.brightness+'"></div><div class="field"><label>Contrast</label><input id="co" type="range" min="0" max="200" value="'+S.adj.contrast+'"></div><div class="field"><label>Saturation</label><input id="sa" type="range" min="0" max="200" value="'+S.adj.saturation+'"></div></div>';if(S.tab==="canvas")p.innerHTML='<div class="group"><h3>Canvas</h3><div class="grid"><button class="btn ratio" data-r="9:16">9:16</button><button class="btn ratio" data-r="16:9">16:9</button><button class="btn ratio" data-r="1:1">1:1</button><button class="btn ratio" data-r="4:5">4:5</button></div></div>';$("#pick")&&($("#pick").onclick=function(){$("#files").click()});$("#clear")&&($("#clear").onclick=function(){S.clips=[];S.selected=null;render()});$("#add")&&($("#add").onclick=function(){S.texts.push({value:$("#tv").value,size:+$("#ts").value,color:"#fff",y:0});render()});["br","co","sa"].forEach(function(id){var e=$("#"+id);if(e)e.oninput=function(){var k=id==="br"?"brightness":id==="co"?"contrast":"saturation";S.adj[k]=+e.value;draw()}});all(".ratio").forEach(function(b){b.onclick=function(){S.ratio=b.getAttribute("data-r");render()}});all(".ai").forEach(function(b){b.onclick=function(){ai(b.getAttribute("data-op"))}})}
all("[data-tab]").forEach(function(b){b.onclick=function(){S.tab=b.getAttribute("data-tab");all("[data-tab]").forEach(function(q){q.classList.toggle("active",q===b)});panel()}});
$("#files").onchange=async function(e){for(var f of e.target.files){var u=URL.createObjectURL(f);if(f.type.indexOf("image/")===0){var im=new Image();im.src=u;await im.decode();S.clips.push({id:crypto.randomUUID(),name:f.name,kind:"image",el:im,file:f})}else if(f.type.indexOf("video/")===0){var v=document.createElement("video");v.src=u;v.muted=true;v.playsInline=true;await new Promise(function(r){v.onloadedmetadata=r});S.clips.push({id:crypto.randomUUID(),name:f.name,kind:"video",el:v,file:f})}else S.clips.push({id:crypto.randomUUID(),name:f.name,kind:"audio",file:f})}S.selected=S.clips[S.clips.length-1].id;render();e.target.value=""};

function save(){localStorage.setItem("sshk-project",JSON.stringify({ratio:S.ratio,texts:S.texts,adj:S.adj,clips:S.clips.map(function(c){return{name:c.name,kind:c.kind}})}));$("#status").textContent="Project saved in this browser."}
async function exportMP4(){if(!S.clips.length)return alert("Import media first.");$("#status").textContent="Rendering WebM and converting to MP4…";var st=cv.captureStream(30),r=new MediaRecorder(st,{mimeType:"video/webm;codecs=vp9"}),chunks=[];r.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};var done=new Promise(function(ok){r.onstop=ok});r.start();var c=S.clips.find(function(q){return q.id===S.selected})||S.clips[0];if(c.kind==="video"){c.el.currentTime=0;c.el.play();var until=Date.now()+Math.min((c.el.duration||5)*1000,8000);while(Date.now()<until){draw();await new Promise(function(q){setTimeout(q,33)})}c.el.pause()}else{draw();await new Promise(function(q){setTimeout(q,3000)})}r.stop();await done;var webm=new Blob(chunks,{type:"video/webm"});try{var F=(await import("https://esm.sh/@ffmpeg/ffmpeg@0.12.15")).FFmpeg,U=await import("https://esm.sh/@ffmpeg/util@0.12.2"),ff=new F();await ff.load({coreURL:await U.toBlobURL("https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.js","text/javascript"),wasmURL:await U.toBlobURL("https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.wasm","application/wasm")});await ff.writeFile("in.webm",await U.fetchFile(webm));await ff.exec(["-i","in.webm","-c:v","libx264","-pix_fmt","yuv420p","-movflags","faststart","out.mp4"]);var d=await ff.readFile("out.mp4"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d.buffer],{type:"video/mp4"}));a.download="design-by-sshk.mp4";a.click();$("#status").textContent="MP4 exported."}catch(e){var a2=document.createElement("a");a2.href=URL.createObjectURL(webm);a2.download="design-by-sshk-fallback.webm";a2.click();$("#status").textContent="MP4 conversion unavailable; WebM fallback exported."}}
$("#save").onclick=save;$("#new").onclick=function(){S.clips=[];S.texts=[];S.selected=null;render()};$("#export").onclick=exportMP4;panel();render();
</script></body></html>
