<script>
const $=s=>document.querySelector(s), all=s=>Array.from(document.querySelectorAll(s));
const S={clips:[],texts:[],selected:null,tab:"media",ratio:"9:16",adj:{brightness:100,contrast:100,saturation:100,blur:0,opacity:100},filter:"none",history:[],future:[],playing:false};
const cv=$("#c"),ctx=cv.getContext("2d"); let raf=0;
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function dims(){return S.ratio==="16:9"?[1920,1080]:S.ratio==="1:1"?[1080,1080]:S.ratio==="4:5"?[1080,1350]:[1080,1920]}
function selected(){return S.clips.find(q=>q.id===S.selected)||S.clips[0]}
function duration(c){return c?.kind==="video"&&isFinite(c.el.duration)?c.el.duration:c?.kind==="audio"&&isFinite(c.el.duration)?c.el.duration:5}
function snap(){return JSON.stringify({ratio:S.ratio,texts:S.texts,adj:S.adj,filter:S.filter,clips:S.clips.map(c=>({id:c.id,name:c.name,kind:c.kind}))})}
function history(){S.history.push(snap());if(S.history.length>30)S.history.shift();S.future=[]}
function restore(v){try{let q=JSON.parse(v);S.ratio=q.ratio||"9:16";S.texts=q.texts||[];S.adj=q.adj||S.adj;S.filter=q.filter||"none";render()}catch(e){}}
function undo(){if(!S.history.length)return;S.future.push(snap());restore(S.history.pop())}
function redo(){if(!S.future.length)return;S.history.push(snap());restore(S.future.pop())}
function filterCSS(){let f="brightness("+S.adj.brightness+"%) contrast("+S.adj.contrast+"%) saturate("+S.adj.saturation+"%) blur("+S.adj.blur+"px)";if(S.filter==="mono")f+=" grayscale(1)";if(S.filter==="warm")f+=" sepia(.25) saturate(1.15)";if(S.filter==="cool")f+=" hue-rotate(12deg) saturate(.9)";if(S.filter==="vintage")f+=" sepia(.35) contrast(1.08)";return f}
function draw(){
 const [w,h]=dims();cv.width=w;cv.height=h;ctx.clearRect(0,0,w,h);ctx.fillStyle="#151922";ctx.fillRect(0,0,w,h);

}
function fmt(v){v=Math.max(0,v||0);return String(Math.floor(v/60)).padStart(2,"0")+":"+String(Math.floor(v%60)).padStart(2,"0")}
function tracks(){

function escape(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function inspector(){
 const c=selected(),t=S.texts.find(x=>x.selected);

}
function render(){tracks();inspector();draw();panel()}
function panel(){

 if(S.tab==="text")p.innerHTML='<div class="group"><h3>Text</h3><div class="field"><label>Text</label><input id="tv" value="Design By SSHK"></div><div class="grid"><div class="field"><label>Size</label><input id="ts" type="number" value="72"></div><div class="field"><label>Color</label><input id="tc" type="color" value="#ffffff"></div></div><button class="btn primary" id="add">Add text layer</button><div class="sep"></div><div class="hint">Text layers render on the canvas and are included in MP4 export.</div></div>';
 if(S.tab==="adjust")p.innerHTML='<div class="group"><h3>Adjustments</h3>'+slider("Brightness","br",S.adj.brightness,0,200)+slider("Contrast","co",S.adj.contrast,0,200)+slider("Saturation","sa",S.adj.saturation,0,200)+slider("Blur","bl",S.adj.blur,0,20)+slider("Opacity","op",S.adj.opacity,0,100)+'</div>';
 if(S.tab==="effects")p.innerHTML='<div class="group"><h3>Filters</h3><div class="grid">'+["none","mono","warm","cool","vintage"].map(f=>'<button class="btn filt" data-f="'+f+'">'+f.toUpperCase()+'</button>').join("")+'</div><div class="sep"></div><h3>Transitions</h3><div class="grid"><button class="btn tr" data-t="None">None</button><button class="btn tr" data-t="Fade">Fade</button><button class="btn tr" data-t="Slide">Slide</button><button class="btn tr" data-t="Zoom">Zoom</button></div></div>';
 if(S.tab==="canvas")p.innerHTML='<div class="group"><h3>Canvas</h3><div class="grid">'+["9:16","16:9","1:1","4:5"].map(r=>'<button class="btn ratio" data-r="'+r+'">'+r+'</button>').join("")+'</div><div class="field"><label>Background</label><input id="bg" type="color" value="#151922"></div></div>';
 const pick=$("#pick");if(pick)pick.onclick=()=>$("#files").click();
 const clear=$("#clear");if(clear)clear.onclick=()=>{history();S.clips=[];S.selected=null;render()};
 const dup2=$("#dup2");if(dup2)dup2.onclick=duplicate;
 const add=$("#add");if(add)add.onclick=()=>{history();S.texts.push({value:$("#tv").value,size:+$("#ts").value,color:$("#tc").value,y:0,x:0,opacity:100,weight:600});render()};
 ["br","co","sa","bl","op"].forEach(id=>{let e=$("#"+id);if(e)e.oninput=()=>{let k={br:"brightness",co:"contrast",sa:"saturation",bl:"blur",op:"opacity"}[id];S.adj[k]=+e.value;draw()}});
 all(".ratio").forEach(b=>b.onclick=()=>{history();S.ratio=b.dataset.r;render()});
 all(".filt").forEach(b=>b.onclick=()=>{history();S.filter=b.dataset.f;render()});
 all(".tr").forEach(b=>b.onclick=()=>{let c=selected();if(c)c.transition=b.dataset.t;$("#status").textContent="Transition: "+b.dataset.t});

}
function slider(label,id,val,min,max){return '<div class="field"><label>'+label+' <span class="pill">'+val+'</span></label><input id="'+id+'" class="range" type="range" min="'+min+'" max="'+max+'" value="'+val+'"></div>'}
async function ai(op){
 const c=selected(),promptEl=$("#prompt");let prompt=promptEl?promptEl.value.trim():"";
 const presets={enhance:"Enhance this image naturally while preserving identity and realistic camera appearance.",remove:"Remove the background cleanly and preserve the subject.",expand:"Expand the image naturally while preserving the subject.",restore:"Restore facial detail naturally without changing identity.",generate:"Create a realistic professional photo."};

 $("#status").textContent="Submitting real AI job…";

  let inputImage=null;if(c&&c.kind==="image"){let im=c.el,scale=Math.min(1,900/Math.max(im.naturalWidth,im.naturalHeight)),cc=document.createElement("canvas");cc.width=Math.round(im.naturalWidth*scale);cc.height=Math.round(im.naturalHeight*scale);cc.getContext("2d").drawImage(im,0,0,cc.width,cc.height);let q=.82;inputImage=cc.toDataURL("image/jpeg",q);while(inputImage.length>950000&&q>.45){q-=.08;inputImage=cc.toDataURL("image/jpeg",q)}}

 }catch(e){$("#status").textContent="AI error: "+e.message}
}
function duplicate(){let c=selected();if(!c)return;history();let copy={...c,id:uid(),name:c.name+" copy"};S.clips.push(copy);S.selected=copy.id;render()}
function split(){let c=selected();if(!c||c.kind!=="video")return;let at=c.el.currentTime;if(at<=.1||at>=c.el.duration-.1)return alert("Play the video and pause where you want to split.");history();let a=document.createElement("video"),b=document.createElement("video");a.src=c.el.src;b.src=c.el.src;a.muted=b.muted=true;a.playsInline=b.playsInline=true;c.name=c.name+" [1]";c.end=at;let c2={...c,id:uid(),name:c.name.replace(" [1]","")+" [2]",el:b,start:at};S.clips.push(c2);S.selected=c2.id;render()}
function removeSelected(){let t=S.texts.find(x=>x.selected);if(t){history();S.texts=S.texts.filter(x=>x!==t);render();return}if(!selected())return;history();let id=S.selected;S.clips=S.clips.filter(c=>c.id!==id);S.selected=S.clips[0]?.id||null;render()}
function play(){let c=selected();if(!c||c.kind!=="video")return;S.playing=true;c.el.play();c.el.playbackRate=c.speed||1;loop()}
function stop(){let c=selected();S.playing=false;if(c?.kind==="video"){c.el.pause();c.el.currentTime=0}cancelAnimationFrame(raf);draw()}
function loop(){if(!S.playing)return;draw();raf=requestAnimationFrame(loop)}
$("#files").onchange=async e=>{history();for(const f of e.target.files){let u=URL.createObjectURL(f);if(f.type.startsWith("image/")){let im=new Image();im.src=u;await im.decode();S.clips.push({id:uid(),name:f.name,kind:"image",el:im,file:f})}else if(f.type.startsWith("video/")){let v=document.createElement("video");v.src=u;v.muted=true;v.playsInline=true;await new Promise(r=>v.onloadedmetadata=r);S.clips.push({id:uid(),name:f.name,kind:"video",el:v,file:f,volume:1,speed:1})}else{let a=new Audio(u);await new Promise(r=>a.onloadedmetadata=r);S.clips.push({id:uid(),name:f.name,kind:"audio",el:a,file:f,volume:1})}}S.selected=S.clips.at(-1)?.id||null;render();e.target.value=""};
$("#play").onclick=play;$("#stop").onclick=stop;$("#split").onclick=split;$("#duplicate").onclick=duplicate;$("#delete").onclick=removeSelected;$("#undo").onclick=undo;$("#redo").onclick=redo;$("#new").onclick=()=>{history();S.clips=[];S.texts=[];S.selected=null;render()};$("#save").onclick=()=>{localStorage.setItem("sshk-project",JSON.stringify({ratio:S.ratio,texts:S.texts,adj:S.adj,filter:S.filter}));$("#status").textContent="Project saved locally."};
$("#project").onclick=()=>{let blob=new Blob([JSON.stringify({app:"Design By SSHK",version:"2.0",ratio:S.ratio,texts:S.texts,adj:S.adj,filter:S.filter},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="design-by-sshk-project.json";a.click()};
$("#export").onclick=exportMP4;$("#addAudio").onclick=()=>{$("#files").accept="audio/*";$("#files").click();setTimeout(()=>$("#files").accept="image/*,video/*,audio/*",1000)};
all("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;all("[data-tab]").forEach(q=>q.classList.toggle("active",q===b));panel()});
