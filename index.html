{display:grid;grid-template-columns:1fr 1fr;gap:6px}.drop{border:1px dashed #394553;border-radius:9px;padding:14px;text-align:center;color:#8993a2}.status{color:#a9b3bf;line-height:1.4;font-size:11px;word-break:break-word}.timeline{grid-column:2/5;background:#0b0e13;border-top:1px solid #29303a;padding:8px;overflow:auto}.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:7px}.toolbar .time{color:#8e99a8;margin-left:auto}.track{height:52px;border-bottom:1px solid #202631;display:flex;gap:5px;align-items:center;overflow:auto}.track label{width:52px;color:#778392;font-size:9px;flex:none}.clip{height:36px;min-width:100px;padding:7px;background:#18202a;border:1px solid #344150;border-radius:7px;cursor:pointer;position:relative}.clip.sel{border-color:#19d4e6;box-shadow:inset 0 0 0 1px #19d4e655}.clip small{display:block;color:#778392;font-size:9px}.hidden{display:none}.pill{display:inline-block;padding:3px 7px;border:1px solid #29303a;border-radius:99px;color:#8993a2;font-size:10px}.danger{color:#ff8f8f}.range{width:100%}.check{display:flex;gap:7px;align-items:center;color:#aeb8c5}.hint{font-size:10px;color:#6f7b89;line-height:1.4}.layers{display:flex;flex-wrap:wrap;gap:5px}.layers button{font-size:11px}.sep{height:1px;background:#29303a;margin:9px 0}
</style></head><body>
<div class="app">
<header class="top"><div class="brand"><i>SSHK</i> Pro Photo Edit</div><span class="pill" id="mode">PHOTO + VIDEO</span><div class="spacer"></div><button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button><button class="btn" id="new">New</button><button class="btn" id="save">Save</button><button class="btn" id="project">Export Project</button><button class="btn primary" id="export">Export MP4</button></header>

<section class="panel left" id="left"></section>

</div><input id="files" class="hidden" type="file" accept="image/*,video/*,audio/*" multiple>
<script>
const $=s=>document.querySelector(s), all=s=>Array.from(document.querySelectorAll(s));
const S={clips:[],texts:[],captions:[],selected:null,tab:"media",ratio:"9:16",adj:{brightness:100,contrast:100,saturation:100,blur:0,opacity:100},filter:"none",history:[],future:[],playing:false,beats:[],scenes:[]};
const cv=$("#c"),ctx=cv.getContext("2d"); let raf=0;
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function dims(){return S.ratio==="16:9"?[1920,1080]:S.ratio==="1:1"?[1080,1080]:S.ratio==="4:5"?[1080,1350]:[1080,1920]}
function selected(){return S.clips.find(q=>q.id===S.selected)||S.clips[0]}
function duration(c){if(c?.end!=null)return Math.max(0,c.end-(c.start||0));return c?.kind==="video"&&isFinite(c.el.duration)?c.el.duration:c?.kind==="audio"&&isFinite(c.el.duration)?c.el.duration:5}
function snap(){return JSON.stringify({ratio:S.ratio,texts:S.texts,captions:S.captions||[],adj:S.adj,filter:S.filter,clips:S.clips.map(c=>({id:c.id,name:c.name,kind:c.kind,speed:c.speed,volume:c.volume,start:c.start||0,end:c.end||null,transform:c.transform||null,keyframes:c.keyframes||[],transition:c.transition||"None"}))})}
function history(){S.history.push(snap());if(S.history.length>30)S.history.shift();S.future=[]}
function restore(v){try{let q=JSON.parse(v);S.ratio=q.ratio||"9:16";S.texts=q.texts||[];S.captions=q.captions||[];S.adj=q.adj||S.adj;S.filter=q.filter||"none";render()}catch(e){}}
function undo(){if(!S.history.length)return;S.future.push(snap());restore(S.history.pop())}
function redo(){if(!S.future.length)return;S.history.push(snap());restore(S.future.pop())}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function keyframeAt(c,time){
 const base={x:0,y:0,scale:1,rotation:0,opacity:100};
 const k=(c.keyframes||[]).slice().sort((a,b)=>a.time-b.time);
 if(!k.length)return {...base,...(c.transform||{})};
 if(time<=k[0].time)return {...base,...k[0]};
 if(time>=k[k.length-1].time)return {...base,...k[k.length-1]};
 let i=1;while(i<k.length&&k[i].time<time)i++;
 const a=k[i-1],b=k[i],t=clamp((time-a.time)/(b.time-a.time),0,1);
 return {x:lerp(a.x??0,b.x??0,t),y:lerp(a.y??0,b.y??0,t),scale:lerp(a.scale??1,b.scale??1,t),rotation:lerp(a.rotation??0,b.rotation??0,t),opacity:lerp(a.opacity??100,b.opacity??100,t)};
}
function addKeyframe(c){
 const time=c?.el?.currentTime||0,base=keyframeAt(c,time);
 c.keyframes=c.keyframes||[];
 c.keyframes.push({time,x:base.x,y:base.y,scale:base.scale,rotation:base.rotation,opacity:base.opacity});
 c.keyframes.sort((a,b)=>a.time-b.time);$("#status").textContent="Animated keyframe added at "+fmt(time);
}
function activeTime(c){return c?.kind==="video"?c.el.currentTime:0}
function filterCSS(){let f="brightness("+S.adj.brightness+"%) contrast("+S.adj.contrast+"%) saturate("+S.adj.saturation+"%) blur("+S.adj.blur+"px)";if(S.filter==="mono")f+=" grayscale(1)";if(S.filter==="warm")f+=" sepia(.25) saturate(1.15)";if(S.filter==="cool")f+=" hue-rotate(12deg) saturate(.9)";if(S.filter==="vintage")f+=" sepia(.35) contrast(1.08)";return f}
function draw(){
 const [w,h]=dims();cv.width=w;cv.height=h;ctx.clearRect(0,0,w,h);ctx.fillStyle="#151922";ctx.fillRect(0,0,w,h);
 const c=selected();if(!c){$("#empty").style.display="grid";return}$("#empty").style.display="none";
 const tm=activeTime(c),tr=keyframeAt(c,tm),alpha=clamp((tr.opacity??100)/100,0,1);
 ctx.save();ctx.globalAlpha=(S.adj.opacity/100)*alpha;ctx.filter=filterCSS();ctx.translate(w/2+tr.x,h/2+tr.y);ctx.rotate((tr.rotation||0)*Math.PI/180);ctx.scale(tr.scale||1,tr.scale||1);
 if(c.kind==="image"){let s=Math.max(w/c.el.naturalWidth,h/c.el.naturalHeight),dw=c.el.naturalWidth*s,dh=c.el.naturalHeight*s;ctx.drawImage(c.el,-dw/2,-dh/2,dw,dh)}
 else if(c.kind==="video"){let s=Math.max(w/c.el.videoWidth,h/c.el.videoHeight),dw=c.el.videoWidth*s,dh=c.el.videoHeight*s;ctx.drawImage(c.el,-dw/2,-dh/2,dw,dh)}
 else{ctx.fillStyle="#202734";ctx.fillRect(-w/2,-h/2,w,h);ctx.fillStyle="#19d4e6";ctx.font="bold 30px system-ui";ctx.textAlign="center";ctx.fillText("♪ "+c.name,0,0)}
 ctx.restore();
 if(c.transition&&c.transition!=="None"){
   const d=duration(c),t=tm,edge=Math.min(.35,d/2),p=t<edge?t/edge:(d-t)<edge?(d-t)/edge:1;
   if(c.transition==="Fade"){ctx.save();ctx.globalAlpha=1-clamp(p,0,1);ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);ctx.restore()}
   if(c.transition==="Zoom"){ctx.save();ctx.globalAlpha=.18*(1-clamp(p,0,1));ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.restore()}
   if(c.transition==="Slide"){ctx.save();ctx.globalAlpha=.15*(1-clamp(p,0,1));ctx.fillStyle="#19d4e6";ctx.fillRect(0,0,w,h);ctx.restore()}
 }
 (S.captions||[]).forEach(t=>{let c=selected(),time=c?.kind==="video"?c.el.currentTime:0;if(time>=t.start&&time<=t.end){ctx.save();ctx.fillStyle="#fff";ctx.font="bold 42px system-ui";ctx.textAlign="center";ctx.strokeStyle="#000";ctx.lineWidth=6;ctx.strokeText(t.text,w/2,h-130);ctx.fillText(t.text,w/2,h-130);ctx.restore()}});S.texts.forEach(t=>{ctx.save();ctx.globalAlpha=t.opacity/100;ctx.fillStyle=t.color;ctx.font=(t.weight||600)+" "+t.size+"px "+(t.font||"system-ui");ctx.textAlign=t.align||"center";ctx.fillText(t.value,w/2+t.x,h/2+t.y);ctx.restore()});
 $("#clock").textContent=(c.kind==="video"?fmt(c.el.currentTime):"00:00")+" / "+fmt(duration(c));
}
function fmt(v){v=Math.max(0,v||0);return String(Math.floor(v/60)).padStart(2,"0")+":"+String(Math.floor(v%60)).padStart(2,"0")}
function tracks(){
 ["video","textTrack","captionTrack","audio"].forEach(id=>$("#"+id).innerHTML="<label>"+(id==="textTrack"?"TEXT":id==="captionTrack"?"CAPTION":id.toUpperCase())+"</label>");
 S.clips.forEach(c=>{let d=document.createElement("div");d.className="clip "+(c.id===S.selected?"sel":"");d.innerHTML=(c.kind==="video"?"🎬 ":c.kind==="audio"?"🎵 ":"🖼️ ")+escape(c.name)+"<small>"+fmt(duration(c))+"</small>";d.onclick=()=>{S.selected=c.id;render()};$("#"+(c.kind==="audio"?"audio":"video")).appendChild(d)});
 S.texts.forEach((t,i)=>{let d=document.createElement("div");d.className="clip";d.textContent=t.value||"Text "+(i+1);d.onclick=()=>{S.texts.forEach(x=>x.selected=false);t.selected=true;render()};$("#textTrack").appendChild(d)});(S.captions||[]).forEach((t,i)=>{let d=document.createElement("div");d.className="clip";d.textContent=t.text||"Caption "+(i+1);d.onclick=()=>{S.captionSelected=i;render()};$("#captionTrack").appendChild(d)})
}
function escape(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function inspector(){
 const c=selected(),t=S.texts.find(x=>x.selected);
 if(t){$("#inspector").innerHTML='<div class="field"><label>Text</label><input id="it" value="'+escape(t.value)+'"></div><div class="grid"><div class="field"><label>Size</label><input id="isz" type="number" value="'+t.size+'"></div><div class="field"><label>Color</label><input id="ic" type="color" value="'+t.color+'"></div></div><div class="field"><label>Y Position</label><input id="iy" class="range" type="range" min="-800" max="800" value="'+t.y+'"></div><button class="btn danger" id="dt">Delete text</button>';$("#it").oninput=e=>{t.value=e.target.value;draw();tracks()};$("#isz").oninput=e=>{t.size=+e.target.value;draw()};$("#ic").oninput=e=>{t.color=e.target.value;draw()};$("#iy").oninput=e=>{t.y=+e.target.value;draw()};$("#dt").onclick=()=>{S.texts=S.texts.filter(x=>x!==t);render()};return}
 if(!c){$("#inspector").textContent="No selection.";return}
 $("#inspector").innerHTML='<div class="field"><label>Name</label><input id="nm" value="'+escape(c.name)+'"></div><div class="field"><label>Speed</label><input id="speed" class="range" type="range" min=".25" max="3" step=".05" value="'+(c.speed||1)+'"></div><div class="field"><label>Volume</label><input id="vol" class="range" type="range" min="0" max="1" step=".05" value="'+(c.volume??1)+'"></div><div class="field"><label>Transition</label><select id="trans"><option>None</option><option>Fade</option><option>Slide</option><option>Zoom</option></select></div><div class="sep"></div><h3>Transform</h3><div class="grid"><div class="field"><label>X</label><input id="tx" type="number" value="0"></div><div class="field"><label>Y</label><input id="ty" type="number" value="0"></div><div class="field"><label>Scale</label><input id="tsc" type="number" step=".01" value="1"></div><div class="field"><label>Rotate °</label><input id="rot" type="number" value="0"></div></div><div class="field"><label>Crop / Zoom <span class="pill">scale based</span></label><input id="crop" class="range" type="range" min="1" max="3" step=".01" value="1"></div><div class="hint">Set a transform, then add keyframes at different times to animate position, scale and rotation.</div><button class="btn" id="kf">Add keyframe at current time</button><button class="btn" id="resetTr">Reset transform</button>';
 const base=keyframeAt(c,activeTime(c));["tx","ty","tsc","rot"].forEach(id=>{const e=$("#"+id);if(e)e.value=id==="tx"?base.x:id==="ty"?base.y:id==="tsc"?base.scale:base.rotation});
$("#tx").oninput=e=>{c.transform={...base,x:+e.target.value};draw()};$("#ty").oninput=e=>{c.transform={...base,y:+e.target.value};draw()};$("#tsc").oninput=e=>{c.transform={...base,scale:+e.target.value};draw()};$("#rot").oninput=e=>{c.transform={...base,rotation:+e.target.value};draw()};$("#crop").oninput=e=>{c.transform={...base,scale:+e.target.value};draw()};$("#resetTr").onclick=()=>{c.transform={x:0,y:0,scale:1,rotation:0,opacity:100};render()};$("#nm").onchange=e=>{c.name=e.target.value;tracks()};$("#speed").oninput=e=>{c.speed=+e.target.value;if(c.el&&c.el.playbackRate)c.el.playbackRate=c.speed};$("#vol").oninput=e=>{c.volume=+e.target.value;if(c.el)c.el.volume=c.volume};$("#trans").onchange=e=>{c.transition=e.target.value};$("#kf").onclick=()=>addKeyframe(c);
}
function render(){tracks();inspector();draw();panel()}
function panel(){
 const p=$("#left");
 if(S.tab==="media")p.innerHTML='<div class="group"><h3>Media</h3><div class="drop">Import photo, video or audio<br><button class="btn primary" id="pick">Choose files</button></div><div class="hint" style="margin-top:8px">Multiple clips supported. Select clips in the timeline.</div></div><div class="group"><h3>Quick actions</h3><div class="grid"><button class="btn" id="dup2">Duplicate</button><button class="btn" id="clear">Clear all</button></div></div>';
 if(S.tab==="ai")p.innerHTML='<div class="group"><h3>AI Lab</h3><div class="field"><label>Instruction</label><textarea id="prompt" rows="4" placeholder="Make this a natural professional photo..."></textarea></div><div class="grid"><button class="btn primary ai" data-op="edit">AI Edit</button><button class="btn ai" data-op="enhance">Enhance</button><button class="btn ai" data-op="remove">Remove BG</button><button class="btn ai" data-op="expand">Expand</button><button class="btn ai" data-op="restore">Face Restore</button><button class="btn ai" data-op="generate">Text → Image</button></div><div class="sep"></div><div class="hint">AI jobs use the real /api/ai → Replicate → Blob → DB → editor pipeline in production.</div></div>';
 if(S.tab==="text")p.innerHTML='<div class="group"><h3>Text</h3><div class="field"><label>Text</label><input id="tv" value="Design By SSHK"></div><div class="grid"><div class="field"><label>Size</label><input id="ts" type="number" value="72"></div><div class="field"><label>Color</label><input id="tc" type="color" value="#ffffff"></div></div><button class="btn primary" id="add">Add text layer</button><div class="sep"></div><div class="hint">Text layers render on the canvas and are included in MP4 export.</div></div>';
 if(S.tab==="adjust")p.innerHTML='<div class="group"><h3>Adjustments</h3>'+slider("Brightness","br",S.adj.brightness,0,200)+slider("Contrast","co",S.adj.contrast,0,200)+slider("Saturation","sa",S.adj.saturation,0,200)+slider("Blur","bl",S.adj.blur,0,20)+slider("Opacity","op",S.adj.opacity,0,100)+'</div>';
 if(S.tab==="effects")p.innerHTML='<div class="group"><h3>Filters</h3><div class="grid">'+["none","mono","warm","cool","vintage"].map(f=>'<button class="btn filt" data-f="'+f+'">'+f.toUpperCase()+'</button>').join("")+'</div><div class="sep"></div><h3>Transitions</h3><div class="grid"><button class="btn tr" data-t="None">None</button><button class="btn tr" data-t="Fade">Fade</button><button class="btn tr" data-t="Slide">Slide</button><button class="btn tr" data-t="Zoom">Zoom</button><button class="btn tr" data-t="Wipe">Wipe</button><button class="btn tr" data-t="Flash">Flash</button></div><div class="sep"></div><h3>Motion</h3><button class="btn" id="autoMotion">Auto Ken Burns</button></div>';
 if(S.tab==="captions")p.innerHTML='<div class="group"><h3>Captions</h3><div class="field"><label>Caption text</label><textarea id="capText" rows="3" placeholder="Type subtitle text"></textarea></div><div class="grid"><div class="field"><label>Start (sec)</label><input id="capStart" type="number" step=".1" value="0"></div><div class="field"><label>End (sec)</label><input id="capEnd" type="number" step=".1" value="3"></div></div><button class="btn primary" id="addCap">Add caption</button><button class="btn" id="autoCap">🎙 Auto Caption (Speech-to-Text)</button><div class="hint">Auto Caption uses the browser SpeechRecognition engine when available. It is real speech-to-text, but browser/OS support varies.</div><div class="sep"></div><h3>TTS</h3><div class="field"><label>Voice text</label><textarea id="ttsText" rows="3" placeholder="Type text to speak..."></textarea></div><div class="grid"><button class="btn" id="speak">▶ Speak</button><button class="btn" id="stopSpeak">■ Stop</button></div><div class="sep"></div><h3>Analysis</h3><div class="grid"><button class="btn" id="beatSync">Beat Sync</button><button class="btn" id="sceneDetect">Scene Detection</button></div><div id="analysisOut" class="hint"></div></div>';if(S.tab==="canvas")p.innerHTML='<div class="group"><h3>Canvas</h3><div class="grid">'+["9:16","16:9","1:1","4:5"].map(r=>'<button class="btn ratio" data-r="'+r+'">'+r+'</button>').join("")+'</div><div class="field"><label>Background</label><input id="bg" type="color" value="#151922"></div></div>';
 const pick=$("#pick");if(pick)pick.onclick=()=>$("#files").click();
 const clear=$("#clear");if(clear)clear.onclick=()=>{history();S.clips=[];S.selected=null;render()};
 const dup2=$("#dup2");if(dup2)dup2.onclick=duplicate;
 const addCap=$("#addCap");if(addCap)addCap.onclick=()=>{S.captions=S.captions||[];S.captions.push({text:$("#capText").value,start:+$("#capStart").value,end:+$("#capEnd").value});render()};
 const ac=$("#autoCap");if(ac)ac.onclick=startAutoCaption;
 const sp=$("#speak");if(sp)sp.onclick=()=>{if(!("speechSynthesis"in window))return alert("Speech synthesis is not supported in this browser.");speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance($("#ttsText").value||"Design By SSHK"))};
 const ss=$("#stopSpeak");if(ss)ss.onclick=()=>speechSynthesis?.cancel();
 const bs=$("#beatSync");if(bs)bs.onclick=analyzeBeats;
 const sd=$("#sceneDetect");if(sd)sd.onclick=detectScenes;const add=$("#add");if(add)add.onclick=()=>{history();S.texts.push({value:$("#tv").value,size:+$("#ts").value,color:$("#tc").value,y:0,x:0,opacity:100,weight:600});render()};
 ["br","co","sa","bl","op"].forEach(id=>{let e=$("#"+id);if(e)e.oninput=()=>{let k={br:"brightness",co:"contrast",sa:"saturation",bl:"blur",op:"opacity"}[id];S.adj[k]=+e.value;draw()}});
 all(".ratio").forEach(b=>b.onclick=()=>{history();S.ratio=b.dataset.r;render()});
 all(".filt").forEach(b=>b.onclick=()=>{history();S.filter=b.dataset.f;render()});
 all(".tr").forEach(b=>b.onclick=()=>{let c=selected();if(c){c.transition=b.dataset.t;render()}$("#status").textContent="Transition: "+b.dataset.t});
 const am=$("#autoMotion");if(am)am.onclick=()=>{let c=selected();if(!c)return;c.keyframes=[{time:0,x:-30,y:0,scale:1,rotation:0,opacity:100},{time:Math.max(1,duration(c)),x:30,y:0,scale:1.12,rotation:0,opacity:100}];$("#status").textContent="Ken Burns keyframes created.";render()};
 all(".ai").forEach(b=>b.onclick=()=>ai(b.dataset.op));
}
async function startAutoCaption(){
 if(!("SpeechRecognition"in window||"webkitSpeechRecognition"in window)){alert("SpeechRecognition is not available in this browser.");return}

 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;let text=e.results[i][0].transcript.trim(),now=performance.now()/1000-started;S.captions.push({text,start:Math.max(0,now-3),end:now+1});render()}};

async function analyzeBeats(){
